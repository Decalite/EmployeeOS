<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EmployeeOS Admin">
<meta name="format-detection" content="telephone=no">
<title>EmployeeOS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>/* EmployeeOS styles - premium dark purple + white. Mobile-first, iPhone safe-area aware. */
:root{color-scheme:dark;
  --bg:#0d0b18;--bg2:#120f21;--panel:#171326;--panel2:#211a36;--line:#34294f;--line2:#ffffff14;
  --purple:#8b5cf6;--purple2:#6d3fd6;--lav:#c4b5fd;--white:#f7f5ff;--muted:#a69bbd;
  --green:#35d39a;--red:#fb7185;--gold:#f6c96b;--blue:#60a5fa;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --tabh:62px;--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 15% -5%,#2a1a52 0,transparent 38%),radial-gradient(circle at 100% 30%,#1c1240 0,transparent 35%),var(--bg);background-attachment:fixed;color:var(--white);
  font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3,h4{margin:0;line-height:1.2}
h1{font-size:24px;letter-spacing:-.3px}h2{font-size:19px}h3{font-size:16px}
p{margin:0}a{color:var(--lav)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11px}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--gold)}.right{text-align:right}.center{text-align:center}.bold{font-weight:700}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}.nowrap{flex-wrap:nowrap}
.stack>*+*{margin-top:12px}.stack-s>*+*{margin-top:8px}.stack-l>*+*{margin-top:18px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:16px;height:16px}.ico.lg{width:26px;height:26px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#8b5cf6,#6336c9);box-shadow:0 6px 18px #6d3fd655;transition:transform .12s ease,opacity .2s,box-shadow .2s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#29213e;border:1px solid var(--line);box-shadow:none}
.btn.white{background:linear-gradient(180deg,#fff,#e9e2ff);color:#2b1561;box-shadow:0 8px 24px #c4b5fd44}
.btn.danger{background:#4a1f30;border:1px solid #854158;box-shadow:none;color:#ffd4dc}
.btn.good{background:linear-gradient(135deg,#1fb887,#138a68);box-shadow:0 6px 18px #1fb88740}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled,.btn.is-busy{opacity:.5;cursor:not-allowed;transform:none}
.btn.is-busy::after{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#ffffff0d;border:1px solid var(--line2);color:var(--white);position:relative}
.iconbtn:active{transform:scale(.94)}
.dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}

/* ---------- inputs ---------- */
.field,select.field,textarea.field{width:100%;min-height:46px;background:#100d1c;border:1px solid var(--line);border-radius:13px;padding:11px 13px;font-size:16px;outline:none;color:var(--white);-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s}
textarea.field{min-height:90px;resize:vertical}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--lav) 50%),linear-gradient(135deg,var(--lav) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.field:focus{border-color:var(--purple);box-shadow:0 0 0 3px #8b5cf633}
.field::placeholder{color:#7d7298}
label.lbl{display:grid;gap:6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.2px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form .full{grid-column:1/-1}
.err{background:#3a1626;border:1px solid #7d3148;color:#ffd0da;border-radius:12px;padding:10px 12px;font-size:13.5px}
.ok{background:#12372c;border:1px solid #1f6b52;color:#c8f5e6;border-radius:12px;padding:10px 12px;font-size:13.5px}
.notice{background:#241a3d;border:1px solid #4b3a74;color:#e6dcff;border-radius:12px;padding:11px 13px;font-size:13.5px}

/* ---------- cards / tiles ---------- */
.card{background:linear-gradient(160deg,#1b1630,#141121);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px #0006}
.card.flat{box-shadow:none}.card.tight{padding:12px}
.card h3{margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:linear-gradient(160deg,#1d1736,#151126);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;font-weight:700}
.tile .v{font-size:22px;font-weight:850;margin:6px 0 2px;letter-spacing:-.4px;overflow-wrap:anywhere}
.tile.accent{background:linear-gradient(145deg,#3b2370,#241946);border-color:#7958ad}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:#30264a;color:#dccfff;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.green{background:#12372c;color:#7ff0c4}.pill.red{background:#451c2b;color:#ffb3c1}.pill.gold{background:#44350f;color:#ffdf8d}.pill.blue{background:#16304f;color:#a9d1ff}.pill.gray{background:#2a2540;color:#b9afd0}
.bar{height:9px;background:#302744;border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#e0d0ff);border-radius:20px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(145deg,#7c4ff0,#4a2a9e);color:#fff;flex:none;border:1px solid #ffffff22}
.avatar.sm{width:34px;height:34px;font-size:12px}
.empty{padding:26px 14px;text-align:center;color:var(--muted)}
.empty .ico{width:34px;height:34px;opacity:.6;margin-bottom:8px}
.list>.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line2)}
.list>.item:last-child{border-bottom:0}
.item .title{font-weight:700}
.item.click{cursor:pointer}.item.click:active{background:#ffffff08}
.seg{display:flex;background:#100d1c;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button,.seg a{display:flex;align-items:center;justify-content:center;text-decoration:none;flex:1;min-height:36px;padding:6px 12px;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap;transition:background .2s,color .2s}
.seg button.on,.seg a.on{background:linear-gradient(135deg,#8b5cf6,#6336c9);color:#fff;box-shadow:0 4px 12px #6d3fd655}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table.t{width:100%;border-collapse:collapse;min-width:520px}
table.t th,table.t td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
table.t th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
table.t tr.click{cursor:pointer}table.t tr.click:active{background:#ffffff08}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{min-height:100vh;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding:calc(var(--sat) + 10px) calc(16px + var(--sar)) 10px calc(16px + var(--sal));
  background:#0d0b18d9;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--line2)}
.brand{font-weight:900;letter-spacing:.3px;font-size:19px;display:flex;align-items:center;gap:8px}
.brand em{font-style:normal;color:var(--lav)}
.brand .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,#a98bff,#5b2fc4);display:grid;place-items:center;box-shadow:0 4px 14px #8b5cf666;font-size:15px}
.main{padding:16px calc(16px + var(--sar)) calc(var(--tabh) + var(--sab) + 26px) calc(16px + var(--sal));max-width:980px;margin:0 auto}
.page{animation:fadeUp .32s cubic-bezier(.2,.8,.2,1)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 16px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--lav);background:none;font-weight:700;padding:6px 0;margin-bottom:6px;min-height:36px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:6px calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));
  background:#110e1fe8;-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-top:1px solid var(--line2)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;color:#8f84a8;text-decoration:none;font-size:10.5px;font-weight:700;border-radius:14px;position:relative;transition:color .2s}
.tabbar a.on{color:#fff}
.tabbar a.on::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:linear-gradient(90deg,#8b5cf6,#e0d0ff)}
.tabbar a.on .ico{stroke:var(--lav)}
.tabbar .dot{top:2px;right:calc(50% - 22px);border-color:#110e1f}
.sidebar{display:none}
@media(min-width:900px){
  .app{display:grid;grid-template-columns:250px minmax(0,1fr)}
  .sidebar{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;padding:22px 14px;border-right:1px solid var(--line2);background:#0e0b1acc}
  .sidebar .brand{padding:0 10px 18px}
  .sidebar a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;color:#c8bfda;text-decoration:none;font-weight:650;position:relative;transition:background .2s}
  .sidebar a:hover{background:#ffffff0a}.sidebar a.on{background:#30234b;color:#fff;box-shadow:inset 0 0 0 1px #554078}
  .sidebar .sp{flex:1}
  .sidebar .dot{position:static;margin-left:auto;border:0}
  .tabbar{display:none}
  .main{padding-bottom:40px;max-width:1080px}
  .topbar .brand{display:none}
  .tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
}
@media(max-width:899px){.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles.three .tile{padding:10px}.tiles.three .v{font-size:16px}.cols2>*+*{margin-top:14px}}
@media(max-width:520px){.form{grid-template-columns:1fr}h1{font-size:22px}.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols2.wide{display:block}

/* ---------- hero / start work ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(125deg,#3b2272,#1e1738 62%,#171227);border:1px solid #7958ad;border-radius:24px;padding:20px;box-shadow:0 18px 50px #3b227255}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#a98bff44,transparent 70%);pointer-events:none}
.hero h2{font-size:22px;margin:8px 0 4px}
.timer{font-variant-numeric:tabular-nums;font-size:38px;font-weight:850;letter-spacing:1px;margin:6px 0}
.startbtn{width:100%;min-height:72px;margin-top:16px;border-radius:20px;font-size:19px;font-weight:900;letter-spacing:.8px;display:flex;align-items:center;justify-content:center;gap:12px;color:#2b1561;background:linear-gradient(180deg,#fff,#e5dcff);box-shadow:0 0 0 0 #c4b5fd88,0 14px 34px #8b5cf655;animation:pulse 2.4s infinite;transition:transform .12s}
.startbtn:active{transform:scale(.97)}
.startbtn.leave{color:#fff;background:linear-gradient(135deg,#c2527c,#7a2c58);box-shadow:0 14px 34px #fb718544;animation:none}
.startbtn:disabled{animation:none;opacity:.6;cursor:not-allowed;box-shadow:none}
.startbtn.is-busy{opacity:.7}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 #35d39a88;animation:pulseG 1.8s infinite;margin-right:6px}

/* ---------- tier badge ---------- */
.badge3d{display:inline-block;flex:none;filter:drop-shadow(0 8px 10px #0009) drop-shadow(0 0 14px var(--glow,#8b5cf655));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.badge3d:hover{transform:translateY(-3px) rotate(-2deg) scale(1.04)}
.tierrow{display:flex;align-items:center;gap:16px}
.ladder{display:flex;justify-content:space-between;gap:6px;margin-top:14px}
.ladder>div{flex:1;text-align:center;font-size:10.5px;color:var(--muted);opacity:.65}.ladder>div.on{opacity:1;color:#fff;font-weight:700}

/* ---------- leaderboard ---------- */
.lb{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:15px;background:#ffffff06;border:1px solid transparent}
.lb+.lb{margin-top:8px}
.lb.me{background:#8b5cf622;border-color:#8b5cf688}
.lb .rk{width:30px;text-align:center;font-weight:900;font-size:16px;color:var(--lav)}
.lb.r1 .rk{color:#ffd666}.lb.r2 .rk{color:#dfe6f2}.lb.r3 .rk{color:#e9a566}
.lb .pts{font-weight:850;font-variant-numeric:tabular-nums}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:6px 0 16px}
.podium>div{text-align:center;flex:1;max-width:120px;min-width:0}
.podium .name{font-size:12.5px;font-weight:700;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .step{height:var(--h);border-radius:12px 12px 4px 4px;margin-top:8px;background:linear-gradient(180deg,#5b3aa8,#2a1c52);display:grid;place-items:start center;padding-top:6px;font-weight:900;color:#fff}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dow{text-align:center;font-size:10.5px;color:var(--muted);padding:4px 0;font-weight:700}
.cal .d{min-height:52px;padding:5px 3px;border-radius:11px;background:#1d1736;border:1px solid #3a2d58;text-align:center;color:var(--white);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.cal .d b{font-size:12.5px}.cal .d small{font-size:9.5px;color:var(--muted);line-height:1.1;word-break:break-all}
.cal .d.today{border-color:var(--lav)}.cal .d.sel{background:#432a7a;border-color:#c4b5fd}
.cal .d.has small{color:#9ff0cf}.cal .d.leave{background:#3a2a12;border-color:#7b5a1d}.cal .d.leave small{color:var(--gold)}
.cal .d.blank{visibility:hidden}.cal .d:disabled{opacity:.4}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:calc(100vh - 350px - var(--sab) - var(--sat));height:calc(100dvh - 350px - var(--sab) - var(--sat));min-height:320px}
@media(min-width:900px){.chat{height:calc(100vh - 260px);height:calc(100dvh - 260px)}}
.chat .msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 2px 10px;display:flex;flex-direction:column;gap:3px}
.bub{max-width:80%;padding:9px 13px;border-radius:20px;background:#2a2142;overflow-wrap:anywhere;font-size:15px;animation:pop .2s ease}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#8b5cf6,#6336c9);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;border-bottom-left-radius:6px}
.bub .att{display:block;margin-top:6px}
.bub img,.bub video{max-width:100%;max-height:260px;border-radius:14px;display:block;background:#000}
.bub .file{display:flex;align-items:center;gap:8px;background:#0000002e;border-radius:12px;padding:9px 11px;color:inherit;text-decoration:none;font-size:13.5px}
.meta{font-size:10.5px;color:var(--muted);margin:2px 6px 8px}.meta.me{align-self:flex-end}.meta.them{align-self:flex-start}
.dayline{align-self:center;font-size:11px;color:var(--muted);margin:10px 0 4px;background:#ffffff0a;padding:3px 10px;border-radius:99px}
.composer{display:flex;gap:8px;align-items:flex-end;padding-top:8px}
.composer .field{border-radius:22px;min-height:44px;max-height:120px;padding:11px 16px;resize:none;overflow-y:auto}
.composer .btn.round{width:44px;min-height:44px;height:44px;padding:0;border-radius:50%}
.pending-file{display:flex;align-items:center;gap:8px;background:#241a3d;border:1px solid #4b3a74;border-radius:12px;padding:7px 10px;font-size:13px;margin-top:8px}
.convo{display:flex;align-items:center;gap:12px;padding:12px;border-radius:15px;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit}
.convo:hover,.convo.on{background:#ffffff0a}.convo .last{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{width:10px;height:10px;border-radius:50%;background:var(--purple);box-shadow:0 0 8px var(--purple);flex:none}
.admin-chat{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
@media(max-width:899px){.admin-chat{display:block}.admin-chat .side.hide-m{display:none}.admin-chat .pane.hide-m{display:none}}

/* ---------- resources ---------- */
.res{display:flex;gap:12px;align-items:center;padding:12px;border-radius:15px;border:1px solid var(--line);background:#1a152b;width:100%;text-align:left;color:inherit}
.res+.res{margin-top:10px}
.res .rico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:#8b5cf622;color:var(--lav);flex:none}
.viewer img,.viewer video{width:100%;max-height:60vh;border-radius:14px;background:#000;object-fit:contain}
.viewer iframe{width:100%;height:60vh;border:0;border-radius:12px;background:#fff}
.viewer pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;background:#100d1c;border:1px solid var(--line);border-radius:12px;padding:14px;max-height:55vh;overflow:auto}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:#05030cc4;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(170deg,#211a38,#151126);border:1px solid #4a3a75;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + var(--sab));animation:slideUp .3s cubic-bezier(.2,.8,.2,1)}
.sheet.wide{max-width:760px}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:#ffffff33;margin:-8px auto 14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:26px;animation:popIn .25s cubic-bezier(.2,.8,.2,1)}.sheet .grab{display:none}}
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--sab) + 14px);z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media(min-width:900px){.toasts{bottom:24px}}

  E.buildTimeline = function (b, names) {

  };

  /* ---------- settings ---------- */
  var cache = { rules: null };
  E.getRules = async function (force) {

    var rows = await db().list('settings', { eq: { key: 'rules' } });
    cache.rules = E.mergeRules(rows[0] && rows[0].value);

  };
  E.saveRules = async function (rules) {

  };

  /* ---------- logging / notifications ---------- */
  E.log = async function (employeeId, action, details) {

  };
  E.notifyMany = async function (userIds, title, body, kind) {

  };
  E.notify = function (userId, title, body, kind) { return E.notifyMany([userId], title, body, kind).catch(function (e) { console.warn('notify failed', e); }); };

  /* ---------- work flow ---------- */
  E.workState = async function (empId) {

      db().list('work_sessions', { eq: { employee_id: empId, ended_at: null }, order: 'started_at.desc' }),
      db().list('work_requests', { eq: { employee_id: empId, status: 'pending' }, order: 'requested_at.desc' })
    ]);

      open: r[0][0] || null,
      pendingStart: r[1].filter(function (x) { return x.request_type === 'start'; })[0] || null,
      pendingLeave: r[1].filter(function (x) { return x.request_type === 'leave'; })[0] || null,
      pendingDayoffs: r[1].filter(function (x) { return x.request_type === 'dayoff'; })
    };
  };
  E.requestStart = async function () {
    var me = EOS.me, st = await E.workState(me.id);

    return rows[0];
  };
  E.requestLeave = async function () {
    var me = EOS.me, st = await E.workState(me.id);

    if (st.pendingLeave) throw fail('Your leave request is already waiting for approval.');
    var rows = await db().insert('work_requests', { employee_id: me.id, request_type: 'leave', request_date: U.todayKey(), session_id: st.open.id });
    return rows[0];
  };
  E.requestDayOff = async function (date, reason) {
    var me = EOS.me;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) throw fail('Choose a date.');
    if (date < U.todayKey()) throw fail('Choose today or a future date.');
    reason = String(reason || '').trim(); if (reason.length < 3) throw fail('Add a short reason.'); if (reason.length > 300) throw fail('Reason is too long (300 max).');
    var ex = await db().list('work_requests', { eq: { employee_id: me.id, request_type: 'dayoff', request_date: date } });
    if (ex.some(function (r) { return r.status !== 'rejected'; })) throw fail('You already have a day-off request for that date.');
    var rows = await db().insert('work_requests', { employee_id: me.id, request_type: 'dayoff', request_date: date, reason: reason });
    return rows[0];
  };

  E.decideRequest = async function (req, decision, note) {
    var me = EOS.me; if (!me || me.role !== 'admin') throw fail('Admins only.');
    if (['approved', 'rejected'].indexOf(decision) < 0) throw fail('Invalid decision.');
    var now = new Date().toISOString();
    var emp = (await db().list('profiles', { eq: { id: req.employee_id } }))[0]; if (!emp) throw fail('Employee no longer exists.');
    if (decision === 'approved' && req.request_type === 'start') {
      var st = await E.workState(req.employee_id); if (st.open) throw fail(emp.full_name + ' already has an active session.');
    }
    var claimed = await db().update('work_requests', { eq: { id: req.id, status: 'pending' } }, { status: decision, reviewed_by: me.id, reviewed_at: now, review_note: note || null });
    if (!claimed.length) throw fail('This request was already handled.');

      if (decision === 'approved') {

          await db().insert('work_sessions', { employee_id: req.employee_id, started_at: now, work_date: U.todayKey(), start_request_id: req.id });
        } else if (req.request_type === 'leave') {
          var open = (await db().list('work_sessions', { eq: { employee_id: req.employee_id, ended_at: null } }))[0];
          if (open) await E.closeSession(open, req.requested_at, req.id);
        }
      }
    } catch (e) {
      await db().update('work_requests', { eq: { id: req.id } }, { status: 'pending', reviewed_by: null, reviewed_at: null, review_note: null });

    }

    await E.notify(req.employee_id, label + ' request ' + decision, note || (decision === 'approved' ? (req.request_type === 'start' ? 'Your work session has started.' : 'Approved by admin.') : 'Not approved by admin.'), decision === 'approved' ? 'success' : 'warning');
    await E.log(req.employee_id, label + ' request ' + decision, note || '');

  };

  E.closeSession = async function (session, endIso, endRequestId) {
    var start = U.ms(session.started_at), end = Math.max(U.ms(endIso || new Date().toISOString()), start);
    var hours = U.round2((end - start) / 3600000);
    var patch = { ended_at: new Date(end).toISOString(), hours: hours }; if (endRequestId) patch.end_request_id = endRequestId;
    var rows = await db().update('work_sessions', { eq: { id: session.id, ended_at: null } }, patch);
    if (!rows.length) return null;
    var rules = await E.getRules();
    var emp = (await db().list('profiles', { eq: { id: session.employee_id } }))[0];
    var dayHours = await E.recomputeDay(emp, session.work_date, rules);
    await E.awardSessionPoints(emp, session, hours, dayHours, rules, patch.ended_at);
    await E.recalcTier(emp.id);
    return rows[0];
  };
  E.recomputeDay = async function (emp, date, rules) {
    var ss = await db().list('work_sessions', { eq: { employee_id: emp.id, work_date: date }, notnull: ['ended_at'] });
    var hours = U.round2(U.sum(ss, function (s) { return s.hours; }));
    var amount = E.dayPay(emp.monthly_base_salary, rules, hours);
    var ex = (await db().list('earning_entries', { eq: { employee_id: emp.id, entry_date: date, entry_type: 'daily' } }))[0];

      var desc = 'Work pay for ' + U.fmtHours(hours);
      if (ex) await db().update('earning_entries', { eq: { id: ex.id } }, { amount: amount, description: desc });
      else await db().insert('earning_entries', { employee_id: emp.id, entry_date: date, entry_type: 'daily', amount: amount, description: desc, created_by: EOS.me.id });

  };
  E.awardSessionPoints = async function (emp, session, hours, dayHours, rules, atIso) {

      if (!ex.length) await db().insert('points_ledger', { employee_id: emp.id, points: rules.points.attendance_day, reason: 'Attendance ' + U.fmtDate(session.work_date), source: 'attendance', ref: ref, created_by: EOS.me.id, created_at: atIso });
    }
  };
  E.endSessionNow = async function (session) {

  /* ---------- pay entries ---------- */
  E.addEntry = async function (empId, type, amount, description, date) {
    if (['extra', 'bonus', 'deduction'].indexOf(type) < 0) throw fail('Choose a valid type.');
    amount = Number(amount); if (!isFinite(amount) || amount <= 0) throw fail('Enter an amount above zero.');
    if (amount > 10000000) throw fail('Amount is too large.');
    description = String(description || '').trim().slice(0, 200); if (!description) throw fail('Add a reason / description.');
    var rows = await db().insert('earning_entries', { employee_id: empId, entry_date: date || U.todayKey(), entry_type: type, amount: U.round2(amount), description: description, created_by: EOS.me.id });
    var label = { extra: 'Extra earning', bonus: 'Bonus', deduction: 'Deduction' }[type];
    await E.notify(empId, label + ': ' + U.money(amount), description, type === 'deduction' ? 'warning' : 'success');
    await E.log(empId, label + ' added ' + U.money(amount), description);

  };
  E.deleteEntry = async function (entry) {
    await db().remove('earning_entries', { eq: { id: entry.id } });

  };
  E.setSalary = async function (empId, salary) {

  };

  /* ---------- points & tiers ---------- */
  E.recalcTier = async function (empId) {

    if (!emp || emp.role !== 'employee' || emp.status !== 'active' || emp.tier_override) return null;
    var rules = await E.getRules();
    var since = new Date(Date.now() - rules.tiers.window_days * 86400000).toISOString();

      var prior = await db().list('tier_history', { eq: { employee_id: empId, new_tier: target } });
      if (!prior.some(function (h) { return Number(h.bonus) > 0; })) {
        bonus = Number(rules.rewards.promotion_bonus[target]);
        await db().insert('earning_entries', { employee_id: empId, entry_date: U.todayKey(), entry_type: 'bonus', amount: bonus, description: 'Promotion bonus: ' + target, ref: 'promo:' + target, created_by: EOS.me.id });
      }
    }
    await db().insert('tier_history', { employee_id: empId, old_tier: emp.tier, new_tier: target, reason: 'Automatic: ' + pts + ' pts in last ' + rules.tiers.window_days + ' days', points_snapshot: pts, manual: false, bonus: bonus, created_by: EOS.me.id });

  E.recalcAll = async function () {
    var emps = await db().list('profiles', { eq: { role: 'employee', status: 'active' } }), changes = [];

  E.setTierManual = async function (empId, tier, reason) {

  E.adjustPoints = async function (empId, delta, reason) {

    await E.log(empId, 'Points adjusted ' + (delta > 0 ? '+' : '') + delta, reason);

  };
  E.leaderboard = async function (period) {
    var rows = await db().rpc('leaderboard', { p_since: E.periodSince(period) });
    return E.rankRows((rows || []).map(function (r) { return Object.assign({}, r, { points: Number(r.points) }); }));
  };
  E.awardMonthlyRewards = async function (monthKey) {
    var rules = await E.getRules(), tops = rules.rewards.monthly_top;
    var from = U.monthStart(monthKey), to = U.monthStart(U.addMonths(monthKey, 1));
    var emps = await db().list('profiles', { eq: { role: 'employee', status: 'active' } });
    var led = await db().list('points_ledger', { gte: { created_at: from.toISOString() }, lt: { created_at: to.toISOString() } });
    var rows = E.rankRows(emps.map(function (e) { return { employee_id: e.id, full_name: e.full_name, points: U.sum(led.filter(function (l) { return l.employee_id === e.id; }), function (l) { return l.points; }) }; }));
    var awarded = [];
    for (var i = 0; i < tops.length && i < rows.length; i++) {
      var r = rows[i], amt = Number(tops[i]); if (!(amt > 0) || r.points <= 0) continue;

      await E.notify(r.employee_id, 'Leaderboard reward ' + U.money(amt), 'You finished #' + (i + 1) + ' in ' + U.monthLabel(monthKey) + '.', 'success');

  };

  /* ---------- messaging / announcements / resources ---------- */
  E.sendMessage = async function (employeeId, body, file) {

    return rows[0];
  };
  E.markRead = function (employeeId) { return db().rpc('mark_read', { p_employee: employeeId }); };
  E.postAnnouncement = async function (title, body, file) {

  };
  E.removeResource = async function (r) {
    await db().remove('resources', { eq: { id: r.id } });

  };

  /* ---------- employee data bundle ---------- */
  E.loadBundle = async function (empId) {

      db().list('earning_entries', Object.assign({ order: 'entry_date.desc' }, f)),

  /* ---------- demo seeding (preview mode only; every value goes through the real engine) ---------- */
  E.seedDemo = async function () {
    var names = [['Aarav Sharma', 28000], ['Priya Singh', 25000], ['Kabir Verma', 22000], ['Meera Nair', 24000]];
    var existing = await db().list('profiles', { eq: { role: 'employee' } });

<script>

(function (root) {
  'use strict';
  var EOS = root.EOS = root.EOS || {};
  var U = EOS.util, ui = EOS.ui, html = U.html, raw = U.raw, icon = ui.icon;
  var C = EOS.shared = {};

  /* Signed/local URLs for inline image + video attachments */
  C.resolveUrls = function (msgs) {
    return Promise.all(msgs.map(function (m) {
      if (m.attachment_path && !m._url && /^(image|video)\//.test(m.attachment_type || '')) {
        return EOS.db.files.url(m._bucket || 'chat', m.attachment_path).then(function (u) { m._url = u; }, function () { m._url = null; });
      }
      return null;
    }));
  };

  C.attHtml = function (m) {
    if (!m.attachment_path) return '';
    var t = m.attachment_type || '', k = U.fileKind(t, m.attachment_name);
    if (k === 'image' && m._url) return html`<a class="att" href="#" data-act="view-att" data-bucket="${m._bucket || 'chat'}" data-path="${m.attachment_path}" data-name="${m.attachment_name}" data-type="${t}"><img src="${m._url}" alt="${m.attachment_name}" loading="lazy"></a>`;
    if (k === 'video' && m._url) return html`<span class="att"><video src="${m._url}" controls playsinline preload="metadata"></video></span>`;
    return html`<a class="att file" href="#" data-act="view-att" data-bucket="${m._bucket || 'chat'}" data-path="${m.attachment_path}" data-name="${m.attachment_name}" data-type="${t}">${icon('file')}<span class="grow" style="overflow:hidden;text-overflow:ellipsis">${m.attachment_name}</span><span class="muted tiny">${U.fmtSize(m.attachment_size)}</span></a>`;
  };

  /* role = the viewer's role: their own messages sit on the right and show Sent/Seen */
  C.msgList = function (msgs, role) {
    var out = [], lastDay = '', lastMine = -1;
    msgs.forEach(function (m, i) { if (m.sender_role === role) lastMine = i; });
    msgs.forEach(function (m, i) {
      var dk = U.dateKey(new Date(m.created_at)), mine = m.sender_role === role;
      if (dk !== lastDay) { out.push(html`<div class="dayline">${dk === U.todayKey() ? 'Today' : U.fmtDate(m.created_at, true)}</div>`); lastDay = dk; }
      var next = msgs[i + 1];
      var showMeta = !next || next.sender_role !== m.sender_role || U.dateKey(new Date(next.created_at)) !== dk || (U.ms(next.created_at) - U.ms(m.created_at)) > 300000;
      var rx = m._rx && m._rx.length ? html`<div class="rxs ${mine ? 'me' : 'them'}">${m._rx.map(function (g) { return html`<button type="button" class="rx ${g.mine ? 'mine' : ''}" data-act="soc-rx" data-mid="${m.id}" data-e="${g.emoji}">${g.emoji}${g.n > 1 ? html`<b>${g.n}</b>` : ''}</button>`; })}</div>` : '';
      out.push(html`<div class="bub ${mine ? 'me' : 'them'}" ${m._menu ? raw('data-act="soc-bubble" data-mid="' + U.esc(m.id) + '" data-mine="' + (mine ? 1 : 0) + '"') : ''}>${m.body ? html`<span>${m.body}</span>` : ''}${C.attHtml(m)}</div>${rx}`);
      if (showMeta) out.push(html`<div class="meta ${mine ? 'me' : 'them'}">${U.fmtTime(m.created_at)}${mine && i === lastMine ? (m.read_at ? ' · Seen' : ' · Sent') : ''}</div>`);
    });
    return out.length ? html`${out}` : ui.empty('chat', 'No messages yet.');
  };

  C.copy = function (text) {
    return new Promise(function (resolve) {
      function fallback() {
        var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
        document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
        var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); resolve(ok);

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * EmployeeOS social.js - people directory, follow, employee<->employee chat, profiles, stories.
 * Used by both apps. The host app calls EOS.social.init(ctx), load(), pageHtml(), after(), refresh().
 * Everything else (profile screen, chat screen, story viewer) is a full-screen layer above the app.
 *   ctx = { role, anns: () => [], onUnread: () => {}, openMessages: (employeeId) => {} }
 */
(function (root) {
  'use strict';
  var EOS = root.EOS = root.EOS || {};
  var U = EOS.util, ui = EOS.ui, html = U.html, raw = U.raw, icon = ui.icon;
  var SOC = EOS.social = {};
  var db = function () { return EOS.db; };
  var $ = function (id) { return document.getElementById(id); };
  var STORY_MS = 5000;
  var QUICK = ['❤️', '😂', '😮', '😢', '👍', '🙏'];
  var EMOJIS = ['😀','😂','🥹','😍','😘','😎','🤔','😮','😢','😭','😡','🥳','👍','👎','👏','🙌','🙏','💪','🔥','✨','🎉','❤️','💜','💔','💯','✅','❌','👀','🤝','☕','🍕','🚀'];

  var SS = {
    me: null, ctx: {}, dir: [], by: {}, follows: [], stories: [], views: [], dm: [], support: [],
    urls: {}, att: {}, rx: [], acc: [], q: '', tab: 'chats', stack: [], sv: null, file: null, pend: null, seq: 0
  };
  SOC._state = SS;

  /* ======================= data ======================= */
  SOC.init = function (ctx) { SS.ctx = ctx || {}; };
  SOC.reset = function () {
    closeAll(); clearStoryTimer();
    SS.me = null; SS.dir = []; SS.by = {}; SS.follows = []; SS.stories = []; SS.views = []; SS.dm = []; SS.support = [];
    SS.urls = {}; SS.att = {}; SS.rx = []; SS.acc = []; SS.q = ''; SS.tab = 'chats'; SS.file = null;
  };
  function isEmp() { return SS.me && SS.me.role === 'employee'; }

  SOC.load = async function () {
    var me = SS.me = EOS.me, emp = me.role === 'employee';
    var r = await Promise.all([
      db().rpc('social_directory'),
      db().list('follows', {}),
      db().list('stories', { gt: { expires_at: new Date().toISOString() }, order: 'created_at.asc' }),
      db().list('story_views', {}),
      emp ? db().list('dm_messages', { order: 'created_at.asc', limit: 1000 }) : Promise.resolve([]),
      emp ? db().list('messages', { eq: { employee_id: me.id }, order: 'created_at.asc', limit: 300 }) : Promise.resolve([]),
      emp ? db().list('dm_reactions', {}) : Promise.resolve([]),
      emp ? db().list('dm_accepts', {}) : Promise.resolve([])
    ]);
    SS.dir = r[0] || []; SS.by = {}; SS.dir.forEach(function (u) { SS.by[u.id] = u; });
    SS.follows = r[1]; SS.stories = r[2]; SS.views = r[3]; SS.dm = r[4]; SS.support = r[5]; SS.rx = r[6] || []; SS.acc = r[7] || [];
    var paths = {};
    SS.dir.forEach(function (u) { if (u.avatar_path) paths[u.avatar_path] = 1; if (u.banner_path) paths[u.banner_path] = 1; });
    await Promise.all(Object.keys(paths).map(function (p) {
      return db().files.url('social', p).then(function (url) { SS.urls[p] = url; }, function () { /* missing file: show initials */ });
    }));
  };
  SOC.unreadDm = function () { return SS.me ? SS.dm.filter(function (m) { return m.recipient_id === SS.me.id && !m.read_at; }).length : 0; };

  SOC.refresh = async function () {
    if (!SS.me) return;
    await SOC.load();
    var top = SS.stack[SS.stack.length - 1];
    paintHome();
    if (top && top.t === 'chat') { await markThread(top); paintMsgs(false); }
    if (top && top.t === 'profile') paintScreen();
  };

  /* ======================= small helpers ======================= */
  function nm(u) { return (u && (u.display_name || u.full_name)) || 'Unknown'; }
  function isAdm(u) { return !!u && u.role === 'admin'; }
  function hue(id) { var h = 0, s = String(id || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function av(u, px, ring) {
    var url = u && u.avatar_path && SS.urls[u.avatar_path];
    return html`<span class="avw ${ring || ''}" style="--s:${px}px;--h:${hue(u && u.id)}"><span class="av">${url ? html`<img src="${url}" alt="">` : html`<span>${U.initials(nm(u))}</span>`}</span></span>`;
  }
  function nameHtml(u, px) { return html`<span class="nm-v">${nm(u)}${isAdm(u) ? ui.verified(px || 15) : ''}</span>`; }
  function sub(u) { return html`@${u.username}${isAdm(u) ? html` · <b class="adm">Admin</b>` : ''}`; }
  function isFollowing(id) { return SS.follows.some(function (f) { return f.follower_id === SS.me.id && f.followee_id === id; }); }
  function followsMe(id) { return SS.follows.some(function (f) { return f.follower_id === id && f.followee_id === SS.me.id; }); }
  function nFollowers(id) { return SS.follows.filter(function (f) { return f.followee_id === id; }).length; }
  function nFollowing(id) { return SS.follows.filter(function (f) { return f.follower_id === id; }).length; }
  function followBtn(u, big) {
    var a = isFollowing(u.id), b = followsMe(u.id);
    var label = a && b ? 'Friends' : a ? 'Following' : b ? 'Follow back' : 'Follow';
    return html`<button class="btn ${a ? 'ghost' : ''} ${big ? '' : 'sm'}" data-act="soc-follow" data-id="${u.id}">${a ? icon('check', 'sm') : icon('plus', 'sm')} ${label}</button>`;
  }
  function preview(m) { return m ? (m.body || (m.attachment_name ? '📎 ' + m.attachment_name : '')) : ''; }
  function accepted(id) { return SS.acc.some(function (a) { return (a.user_id === SS.me.id && a.peer_id === id) || (a.user_id === id && a.peer_id === SS.me.id); }); }
  function hasIn(id) { return SS.dm.some(function (m) { return m.sender_id === id && m.recipient_id === SS.me.id; }); }
  function hasOut(id) { return SS.dm.some(function (m) { return m.sender_id === SS.me.id && m.recipient_id === id; }); }
  /* 'open' = normal chat, 'in' = their request waiting for me, 'out' = my request waiting for them, 'new' = nothing yet */
  function dmState(id) {
    if (accepted(id)) return 'open';
    if (hasIn(id) && !hasOut(id)) return 'in';
    if (hasOut(id)) return 'out';
    return 'new';
  }
  /* employees: only people you follow (or who already wrote to you); admin chat uses the support thread */
  function canMessage(u) {
    if (!u || u.id === SS.me.id) return false;
    if (!isEmp()) return u.role === 'employee';
    if (u.role === 'admin') return true;
    return isFollowing(u.id) || dmState(u.id) !== 'new';
  }

  /* ======================= stories row ======================= */
  function activeStories() { var n = Date.now(); return SS.stories.filter(function (s) { return U.ms(s.expires_at) > n; }); }
  function storiesBy(uid) { return activeStories().filter(function (s) { return s.author_id === uid; }).sort(function (a, b) { return U.ms(a.created_at) - U.ms(b.created_at); }); }
  function viewed(s) { return s.author_id === SS.me.id || SS.views.some(function (v) { return v.story_id === s.id && v.viewer_id === SS.me.id; }); }
  function feedOrder() {
    var by = {}; activeStories().forEach(function (s) { (by[s.author_id] = by[s.author_id] || []).push(s); });
    var ids = Object.keys(by).filter(function (id) { return id !== SS.me.id && SS.by[id]; });
    function unseen(id) { return by[id].some(function (s) { return !viewed(s); }); }
    function latest(id) { return Math.max.apply(null, by[id].map(function (s) { return U.ms(s.created_at); })); }
    ids.sort(function (a, b) { var x = unseen(a), y = unseen(b); return x !== y ? (x ? -1 : 1) : latest(b) - latest(a); });
    if (by[SS.me.id]) ids.unshift(SS.me.id);
    return ids;
  }
  function storiesHtml() {
    var me = SS.by[SS.me.id] || SS.me, order = feedOrder();
    return html`<label class="st-item"><input type="file" class="hidden" accept="image/*,video/*" data-change="soc-story-file"><span class="avw addst" style="--s:62px;--h:${hue(me.id)}"><span class="av">${SS.urls[me.avatar_path] ? html`<img src="${SS.urls[me.avatar_path]}" alt="">` : html`<span>${U.initials(nm(me))}</span>`}</span><b class="plus">+</b></span><span class="stn">Add story</span></label>
      ${order.map(function (uid) {
        var u = SS.by[uid]; if (!u) return '';
        var unseen = storiesBy(uid).some(function (s) { return !viewed(s); });
        return html`<button class="st-item" data-act="soc-story" data-id="${uid}">${av(u, 62, unseen ? 'ring-new' : 'ring-seen')}<span class="stn">${uid === SS.me.id ? 'Your story' : nm(u).split(' ')[0]}</span></button>`;
      })}`;
  }

  /* ======================= home page (inside the app) ======================= */
  SOC.pageHtml = function () {
    var emp = isEmp(); SS.view = ''; SS.q = '';
    var u = SS.by[SS.me.id] || SS.me, rq = emp ? requestList().length : 0, an = SS.ctx.anns ? SS.ctx.anns().length : 0;
    return html`${emp
      ? html`<div class="ig-head"><button class="iconbtn" data-act="soc-profile" data-id="${SS.me.id}" aria-label="My profile">${av(u, 30, 'ring-none')}</button><h1 class="ig-title">${u.username || nm(u)}</h1><a class="iconbtn" href="#/search" aria-label="New message">${icon('edit')}</a></div>`
      : html`<div class="page-head"><div><h1>Community</h1><div class="sub">People, stories and your public profile</div></div><button class="btn ghost sm" data-act="soc-profile" data-id="${SS.me.id}">${icon('user', 'sm')} My profile</button></div>`}
      <label class="searchbox ig">${icon('search', 'sm')}<input id="socSearch" class="field" type="search" placeholder="Search chats or people" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" value="${SS.q}"></label>
      <div class="st-row" id="socStories">${storiesHtml()}</div>
      ${emp ? html`<div class="pills"><button class="pillbtn ${SS.tab === 'chats' ? 'on' : ''}" data-act="soc-tab" data-t="chats">Chats${unreadChats() ? html`<i class="bdg">${unreadChats()}</i>` : ''}</button><button class="pillbtn ${SS.tab === 'req' ? 'on' : ''}" data-act="soc-tab" data-t="req">Requests${rq ? html`<i class="bdg">${rq}</i>` : ''}</button><button class="pillbtn ${SS.tab === 'ann' ? 'on' : ''}" data-act="soc-tab" data-t="ann">Announcements${an ? html`<i class="bdg">${an}</i>` : ''}</button></div>` : ''}
      <div id="socList" style="margin-top:6px">${listHtml()}</div>`;
  };
  function unreadChats() { return SS.dm.filter(function (m) { return m.recipient_id === SS.me.id && !m.read_at && dmState(m.sender_id) !== 'in'; }).length + SS.support.filter(function (m) { return m.sender_role === 'admin' && !m.read_at; }).length; }
  SOC.searchHtml = function () {
    SS.view = 'search'; SS.q = '';
    return html`<div class="page-head"><div><h1>Search</h1><div class="sub">Find colleagues and the admin by name or ID, then follow</div></div></div>
      <label class="searchbox">${icon('search', 'sm')}<input id="socSearch" class="field" type="search" placeholder="Search by name or ID" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" value="${SS.q}"></label>
      <div id="socList" style="margin-top:12px">${listHtml()}</div>`;
  };
  SOC.leaveSearch = function () { SS.view = ''; };
  SOC.active = function () { return !!(SS.me && SS.stack.length); };
  SOC.setTab = function (t) { SS.tab = t; };
  SOC.after = function () { /* nothing to bind: events are delegated */ };
  function paintHome() {
    var a = $('socStories'), l = $('socList');
    if (a) a.innerHTML = String(storiesHtml());
    if (l) l.innerHTML = String(listHtml());
    if (SS.ctx.rerender) SS.ctx.rerender();
  }

  function threadList() {
    var t = {};
    SS.dm.forEach(function (m) {
      var peer = m.sender_id === SS.me.id ? m.recipient_id : m.sender_id;
      var x = t[peer] = t[peer] || { id: peer, last: m, unread: 0 };
      x.last = m; if (m.recipient_id === SS.me.id && !m.read_at) x.unread++;
    });
    return Object.keys(t).map(function (k) { return t[k]; }).sort(function (a, b) { return U.ms(b.last.created_at) - U.ms(a.last.created_at); });
  }
  function requestList() { return threadList().filter(function (t) { return dmState(t.id) === 'in'; }); }
  function personRow(u) {
    return html`<div class="person" data-act="soc-profile" data-id="${u.id}">${av(u, 48, storiesBy(u.id).length ? (storiesBy(u.id).some(function (s) { return !viewed(s); }) ? 'ring-new' : 'ring-seen') : '')}
      <div class="grow"><div class="bold">${nameHtml(u)}</div><div class="muted small">${sub(u)}${u.role === 'employee' ? html` · ${u.tier}` : ''}</div>${u.bio ? html`<div class="muted tiny bio1">${u.bio}</div>` : ''}</div>
      <div class="row nowrap">${followBtn(u)}${canMessage(u) ? html`<button class="iconbtn" style="width:38px;height:38px" data-act="soc-msg" data-id="${u.id}" aria-label="Message">${icon('chat', 'sm')}</button>` : ''}</div></div>`;
  }
  function annHtml() {
    var anns = SS.ctx.anns ? SS.ctx.anns() : [];
    return html`<div class="stack">${anns.length ? anns.map(function (a) { return html`<div class="card"><div class="row between"><h3>${a.title}</h3><span class="muted tiny">${U.fmtDateTime(a.created_at)}</span></div><p class="muted" style="white-space:pre-wrap">${a.body}</p>${a.attachment_path ? html`<button class="btn ghost sm" style="margin-top:10px" data-act="view-ann" data-path="${a.attachment_path}" data-name="${a.attachment_name}" data-type="${a.attachment_type || ''}">${icon('clip', 'sm')} ${a.attachment_name}</button>` : ''}</div>`; }) : ui.empty('mega', 'No announcements yet.')}</div>`;
  }
  function listHtml() {
    var q = SS.q.trim().toLowerCase(), me = SS.me;
    if (SS.view === 'search' && !q) {
      var all = SS.dir.filter(function (u) { return u.id !== me.id; }).sort(function (a, b) { return (isFollowing(a.id) ? 1 : 0) - (isFollowing(b.id) ? 1 : 0); });
      return all.length ? html`<h3 style="margin:4px 0 6px">Suggested for you</h3><div class="people">${all.map(personRow)}</div>` : ui.empty('users', 'No one has joined yet.');
    }
    if (SS.view !== 'search' && isEmp() && SS.tab === 'ann') return annHtml();
    if (SS.view !== 'search' && isEmp() && SS.tab === 'req' && !q) {
      var rq = requestList();
      return rq.length ? html`<p class="muted small" style="margin:0 4px 8px">People who follow-searched you and sent a message. Accept to chat.</p><div class="people">${rq.map(function (t) { var u = SS.by[t.id]; if (!u) return ''; return html`<div class="person" data-act="soc-msg" data-id="${u.id}">${av(u, 48, '')}<div class="grow"><div class="bold">${nameHtml(u)}</div><div class="muted small ellip">${preview(t.last)}</div></div>${t.unread ? html`<span class="udot"></span>` : ''}</div>`; })}</div>` : ui.empty('chat', 'No message requests.');
    }
    if (q) {
      var res = SS.dir.filter(function (u) { return u.id !== me.id && (nm(u) + ' ' + u.full_name + ' ' + u.username + ' ' + (u.employee_code || '')).toLowerCase().indexOf(q) >= 0; });
      return res.length ? html`<div class="people">${res.map(personRow)}</div>` : ui.empty('search', 'No one found for "' + SS.q.trim() + '".');
    }
    var others = SS.dir.filter(function (u) { return u.id !== me.id; });
    if (!isEmp()) return others.length ? html`<h3 style="margin-bottom:6px">Everyone</h3><div class="people">${others.map(personRow)}</div>` : ui.empty('users', 'No one has joined yet.');
    var th = threadList().filter(function (t) { return dmState(t.id) !== 'in'; }), reqs = requestList(), supUnread = SS.support.filter(function (m) { return m.sender_role === 'admin' && !m.read_at; }).length, sl = SS.support[SS.support.length - 1];
    var inThreads = {}; th.forEach(function (t) { inThreads[t.id] = 1; });
    var sugg = others.filter(function (u) { return !isFollowing(u.id) && !inThreads[u.id]; }).slice(0, 6);
    return html`<div class="people">
        <div class="person" data-act="soc-support"><span class="avw" style="--s:48px"><span class="av sup">${icon('shield')}</span></span><div class="grow"><div class="bold"><span class="nm-v">Admin ${ui.verified(15)}</span></div><div class="muted small ellip">${sl ? (sl.sender_role === 'employee' ? 'You: ' : '') + preview(sl) : 'Official support chat'}</div></div>${supUnread ? html`<span class="udot"></span>` : ''}</div>
        ${th.map(function (t) { var u = SS.by[t.id]; if (!u) return ''; return html`<div class="person" data-act="soc-msg" data-id="${u.id}">${av(u, 48, storiesBy(u.id).length ? 'ring-new' : '')}<div class="grow"><div class="bold">${nameHtml(u)}</div><div class="${t.unread ? 'bold' : 'muted'} small ellip">${t.last.sender_id === me.id ? 'You: ' : ''}${preview(t.last)} <span class="muted tiny">· ${U.ago(t.last.created_at)}</span></div></div>${t.unread ? html`<span class="udot"></span>` : ''}</div>`; })}
      </div>
      ${th.length ? '' : html`<div class="muted small" style="margin:10px 4px">No chats yet. Search a colleague above, or start with someone below.</div>`}
      ${sugg.length ? html`<h3 style="margin:16px 0 6px">People you may know</h3><div class="people">${sugg.map(personRow)}</div>` : ''}`;
  }
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'socSearch') { SS.q = e.target.value; if (SS.q && SS.tab !== 'chats' && SS.view !== 'search') { SS.tab = 'chats'; var sg = document.querySelectorAll('[data-act=soc-tab]'); Array.prototype.forEach.call(sg, function (b) { b.classList.toggle('on', b.getAttribute('data-t') === 'chats'); }); } var l = $('socList'); if (l) l.innerHTML = String(listHtml()); }
    if (e.target && e.target.id === 'socInput') { e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'socInput' && e.key === 'Enter' && !e.shiftKey && !/iPhone|iPad|Android/i.test(navigator.userAgent)) { e.preventDefault(); var f = e.target.form; if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true })); }
  });

  /* ======================= full-screen layer ======================= */
  function layer() {
    var el = $('soc');
    if (!el) { el = document.createElement('div'); el.id = 'soc'; el.className = 'soc'; document.body.appendChild(el); document.body.classList.add('soc-open'); }

        <div class="tile"><div class="k">Bonuses</div><div class="v good">${U.money(bk.bonus + bk.extra)}</div></div><div class="tile"><div class="k">Hours worked</div><div class="v">${U.fmtHours(hrs)}</div></div></div>

  async function loadEmployee() {

  function pageDetail() {
    var d = S.det; if (!d) return html`<a class="back" href="#/employees">${icon('left', 'sm')} Employees</a>${ui.empty('users', 'Employee not found.')}`;

    var body = { profile: tabProfile, pay: tabPay, attendance: tabAttendance, rank: tabRank, activity: tabActivity }[t] || tabProfile;

      <div class="card"><div class="tierrow">${ui.badge(e.tier, 68)}<div class="grow"><h2>${e.full_name}</h2><div class="muted small">${e.employee_code} · ${e.tier} tier ${e.tier_override ? '(manual)' : ''}</div><div style="margin-top:6px">${spill(e)}</div></div><a class="iconbtn" href="#/messages/${e.id}" aria-label="Message">${icon('chat')}</a></div></div>

  }
  function tabPay(d, e) {
    var rules = S.rules, sm = E.summarize(d.b.entries, d.b.sessions, U.monthKey(), U.todayKey()), manual = d.b.entries.filter(function (x) { return x.entry_type !== 'daily'; }).slice(0, 50);
    return html`<div class="tiles three"><div class="tile"><div class="k">Daily rate</div><div class="v">${U.money(E.dailyRate(e.monthly_base_salary, rules))}</div><div class="muted tiny">${U.money(e.monthly_base_salary)} ÷ ${rules.pay.working_days}</div></div><div class="tile"><div class="k">Work pay (month)</div><div class="v">${U.money(sm.month.daily)}</div></div><div class="tile"><div class="k">Net (month)</div><div class="v">${U.money(sm.month.net)}</div></div></div>

      <form class="card stack" style="margin-top:14px" data-form="add-entry" data-id="${e.id}"><h3>Add bonus, extra earning or deduction</h3><div class="err hidden" data-err></div>

      <div class="card" style="margin-top:14px"><h3>Leave &amp; day-off requests</h3>${d.b.requests.filter(function (r) { return r.request_type !== 'start'; }).length ? html`<div class="list">${d.b.requests.filter(function (r) { return r.request_type !== 'start'; }).slice(0, 30).map(function (r) { return html`<div class="item"><div class="grow"><div class="title">${reqLabel(r)}</div><div class="muted small">${U.fmtDateTime(r.requested_at)}${r.reason ? ' · ' + r.reason : ''}</div></div><span class="pill ${{ pending: 'gold', approved: 'green', rejected: 'red' }[r.status]}">${r.status}</span></div>`; })}</div>` : ui.empty('calendar', 'None.')}</div>`;
  }
  function tabRank(d, e) {

      <form class="card stack" style="margin-top:14px" data-form="set-tier" data-id="${e.id}"><h3>Change tier</h3><div class="err hidden" data-err></div>

  async function loadMessages() {
    var id = S.route[1], all = await db.list('messages', { order: 'created_at.desc', limit: 800 }), th = {};
    all.forEach(function (m) { var t = th[m.employee_id] || (th[m.employee_id] = { last: m, unread: 0 }); if (m.sender_role === 'employee' && !m.read_at) t.unread++; });
    S.chat.threads = th;
    if (id === 'announcements') S.chat.anns = await db.list('announcements', { order: 'created_at.desc', limit: 30 });
    else if (id && S.names[id]) {
      S.chat.msgs = all.filter(function (m) { return m.employee_id === id; }).reverse();
      await C.resolveUrls(S.chat.msgs);
      if (S.chat.msgs.some(function (m) { return m.sender_role === 'employee' && !m.read_at; })) { await E.markRead(id); S.chat.msgs.forEach(function (m) { if (m.sender_role === 'employee') m.read_at = m.read_at || new Date().toISOString(); }); th[id].unread = 0; await refreshCore(); }

    S.chat.file = null;
  }

    return html`<a class="convo ${id === 'announcements' ? 'on' : ''}" href="#/messages/announcements" style="text-decoration:none"><div class="avatar" style="background:linear-gradient(145deg,#f6c96b,#b77a24)">${icon('mega')}</div><div class="grow"><div class="bold">Team announcements</div><div class="last">Broadcast to all employees</div></div></a>

  function pendingHtml() { var f = S.chat.file; return f ? html`<div class="pending-file">${icon('clip', 'sm')}<span class="grow" style="overflow:hidden;text-overflow:ellipsis">${f.name} · ${U.fmtSize(f.size)}</span><button type="button" class="iconbtn" style="width:32px;height:32px" data-act="chat-clear-file" aria-label="Remove">${icon('x', 'sm')}</button></div>` : ''; }

      var id = el.getAttribute('data-id'), e = S.names[id];
      if (!(await ui.confirm({ title: 'Remove ' + e.full_name + '?', body: 'This permanently deletes the account and all earnings, attendance, points and chat history. This cannot be undone. Consider Suspend instead.', ok: 'Delete permanently', danger: true }))) return;
      await db.admin.deleteEmployee(id); await refreshCore(); ui.ok('Employee removed'); ui.go('employees');
    },
    'view-res': async function (el) { var r = RS.list.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]; if (!r) return; if (r.storage_path) return ui.viewFile('resources', r.storage_path, r.file_name, r.mime_type, r.title); ui.modal({ title: r.title, wide: true, body: html`<div class="viewer"><pre>${r.body || ''}</pre></div>` }); },
    'del-res': async function (el) { var r = RS.list.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]; if (!r) return; if (!(await ui.confirm({ title: 'Delete “' + r.title + '”?', body: 'Employees will no longer see it.', ok: 'Delete', danger: true }))) return; await E.removeResource(r); await loadRes(); renderPage(false); ui.ok('Deleted'); },
    'view-att': async function (el) { await ui.viewFile(el.getAttribute('data-bucket') || 'chat', el.getAttribute('data-path'), el.getAttribute('data-name'), el.getAttribute('data-type')); },
    'view-ann': async function (el) { await ui.viewFile('resources', el.getAttribute('data-path'), el.getAttribute('data-name'), el.getAttribute('data-type')); },
    'del-ann': async function (el) { if (!(await ui.confirm({ title: 'Delete announcement?', body: 'It disappears for everyone.', ok: 'Delete', danger: true }))) return; await db.remove('announcements', { eq: { id: el.getAttribute('data-id') } }); await loadMessages(); renderPage(false); },
    'chat-clear-file': function () { S.chat.file = null; $('pendingFile').innerHTML = ''; $('chatFile').value = ''; },
    seed: async function () {
      if (!(await ui.confirm({ title: 'Load sample employees?', body: 'Creates 4 employees with 6 days of work history, computed by the real engine.', ok: 'Load' }))) return;
      var out = await E.seedDemo(); await refreshCore(); await maybeRecalc(true);
      ui.modal({ title: 'Sample employees created', body: html`<div class="ok">Preview-only logins (shown once):</div><div class="list" style="margin-top:10px">${out.map(function (o) { return html`<div class="item"><div class="grow"><b>${o.name}</b></div><code>${o.code}</code><code>${o.password}</code></div>`; })}</div>` });
    },
    'reset-preview': async function () { if (!(await ui.confirm({ title: 'Erase all preview data?', body: 'Employees, pay, chat — everything stored in this browser.', ok: 'Erase', danger: true }))) return; ui.closeAllModals(); stop(); db.resetPreview(); await showLogin(); }
  }, {
    login: async function (f, v) {
      var me = await db.auth.signIn(v.id, v.pw);
      if (me.role !== 'admin') { await db.auth.signOut(); throw new Error('This portal is for administrators only.'); }
      $('root').innerHTML = String(html`<div class="center-screen"><div class="spinner"></div></div>`);
      try { await start(me); } catch (e) { if (e && e.message === 'inactive') return; await db.auth.signOut(); stop(); await showLogin(); throw e; }
    },
    setup: async function (f, v) { var me = await db.auth.setupAdmin({ name: v.name, email: v.email, password: v.pw }); $('root').innerHTML = String(html`<div class="center-screen"><div class="spinner"></div></div>`); await start(me); ui.ok('Preview admin created ✓'); },
    'add-emp': async function (f, v) {
      var p = await db.admin.createEmployee({ employee_code: v.employee_code.trim(), full_name: v.full_name, password: v.password, monthly_base_salary: Number(v.monthly_base_salary), phone: v.phone, email: (v.email || '').trim() });
      await E.notify(p.id, 'Welcome to EmployeeOS', 'Your account is ready. Tap START WORK when your shift begins.', 'info'); await E.log(p.id, 'Employee account created', '');
      await refreshCore(); var m = ui.topModal(); if (m) { m.set(credsHtml(v.employee_code.trim(), v.password, v.full_name + ' was added')); }
      renderPage(false);
    },
    'edit-emp': async function (f, v) {
      var id = f.getAttribute('data-id'), old = S.names[id], patch = { full_name: v.full_name, employee_code: v.employee_code.trim(), phone: v.phone, email: (v.email || '').trim(), monthly_base_salary: Number(v.monthly_base_salary) };
      await db.admin.updateEmployee(id, patch);
      if (Number(old.monthly_base_salary) !== patch.monthly_base_salary) { await E.notify(id, 'Your monthly salary was updated', 'New base salary: ' + U.money(patch.monthly_base_salary), 'info'); await E.log(id, 'Base salary set to ' + U.money(patch.monthly_base_salary), ''); }
      await E.log(id, 'Profile edited', ''); ui.ok('Saved ✓'); await reloadDetail();
    },
    'reset-pw': async function (f, v) { var id = f.getAttribute('data-id'); await db.admin.updateEmployee(id, {}, v.password); await E.log(id, 'Password reset', ''); var m = ui.topModal(); if (m) m.set(credsHtml(S.names[id].employee_code, v.password, 'Password updated')); },
    'set-salary': async function (f, v) { await E.setSalary(f.getAttribute('data-id'), v.salary); ui.ok('Salary updated ✓'); await reloadDetail(); },
    'add-entry': async function (f, v) { await E.addEntry(f.getAttribute('data-id'), v.type, v.amount, v.description, v.date); ui.ok('Entry added ✓'); await reloadDetail(); },
    'add-entry-any': async function (f, v) { await E.addEntry(v.emp, v.type, v.amount, v.description, v.date); ui.closeAllModals(); ui.ok('Entry added ✓'); await loadPayroll(); renderPage(false); },
    'set-tier': async function (f, v) { await E.setTierManual(f.getAttribute('data-id'), v.tier, v.reason); ui.ok('Tier updated ✓'); await reloadDetail(); },
    'adj-points': async function (f, v) { await E.adjustPoints(f.getAttribute('data-id'), v.delta, v.reason); ui.ok('Points updated ✓'); await reloadDetail(); },
    'add-res': async function (f, v) {
      var file = v.file && v.file.size ? v.file : null;
      await E.addResource({ title: v.title, type: v.type, description: v.description, body: v.body, file: file }); f.reset(); await loadRes(); renderPage(false); ui.ok('Published ✓');
    },
    'post-ann': async function (f, v) { var file = v.file && v.file.size ? v.file : null; await E.postAnnouncement(v.title, v.body, file); ui.ok('Announcement sent ✓'); await loadMessages(); renderPage(false); },
    'chat-send': async function (f, v) {
      var id = S.route[1], body = (v.body || '').trim(), file = S.chat.file; if (!body && !file) return;
      await E.sendMessage(id, body, file); S.chat.file = null; f.reset(); $('pendingFile').innerHTML = ''; $('chatInput').style.height = 'auto'; S.lastSig = ''; await refreshMessages(); afterMessages();
    },
    rules: async function (f, v) { await E.saveRules(rulesFrom(v)); S.rules = await E.getRules(true); ui.ok('Rules saved ✓'); await maybeRecalc(true); },
    'admin-pw': async function (f, v) { if (v.pw1 !== v.pw2) throw new Error('Passwords do not match.'); await db.auth.changePassword(v.pw1); f.reset(); ui.ok('Password updated ✓'); }
  }, {
    'emp-search': function (el) { S.search = el.value; $('empList').innerHTML = String(empListHtml(S.emps.filter(function (e) { var q = S.search.toLowerCase(); return !q || (e.full_name + ' ' + e.employee_code).toLowerCase().indexOf(q) >= 0; }))); },
    'chat-file': function (el) {
      var f = el.files && el.files[0]; if (!f) return; if (f.size > db.files.max) { el.value = ''; throw new Error('File is too large (max ' + U.fmtSize(db.files.max) + ').'); }
      S.chat.file = f; $('pendingFile').innerHTML = String(pendingHtml());
    }
  });
  /* live search as you type (change fires only on blur) */
  document.addEventListener('input', function (e) { if (e.target && e.target.id === 'empSearch') { S.search = e.target.value; var q = S.search.toLowerCase(); $('empList').innerHTML = String(empListHtml(S.emps.filter(function (x) { return !q || (x.full_name + ' ' + x.employee_code).toLowerCase().indexOf(q) >= 0; }))); } });

  boot();
})();

</script>
</body>
</html>
